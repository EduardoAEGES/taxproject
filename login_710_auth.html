<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUNAT - Clave SOL</title>
    <link rel="stylesheet" href="login_710_auth.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Subtle Back Button -->
    <a href="index.html" class="subtle-back-btn"><i class="fas fa-arrow-left"></i> Volver al Menú Inicial</a>

    <!-- Cat Logo -->
    <div class="cat-logo-container">
        <img src="favicon.png" alt="Cat Logo" class="cat-logo" style="width: 40px; height: 40px; border-radius: 50%;"> 
    </div>

    <div class="auth-page-container">
        
        <div class="auth-left-section">
            <h1 class="auth-welcome">Bienvenido</h1>
            <p class="auth-subtitle">Ingresa los datos de tu Clave SOL</p>
        </div>

        <div class="auth-box-wrapper">
            <div class="auth-box">
                <div class="login-tabs">
                    <button class="tab-btn active">RUC</button>
                    <button class="tab-btn">DNI</button>
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <input type="text" id="ruc" name="ruc" placeholder="RUC" required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <input type="text" id="usuario" name="usuario" placeholder="Usuario" required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <input type="password" id="clave" name="clave" placeholder="Contraseña" required autocomplete="off">
                    </div>

                    <div class="remember-me">
                        <label>Recuérdame, para entrar más fácil</label>
                        <label class="switch">
                            <input type="checkbox">
                            <span class="slider round"></span>
                        </label>
                    </div>
                    
                    <div class="forgot-links">
                        <a href="#">Si olvidaste tu usuario y/o contraseña solicítalos desde SUNAT Virtual</a>
                    </div>

                    <div class="error-message" id="error-message" style="display: none; color: red; text-align: center; margin-bottom: 10px; font-size: 13px;">
                        Usuario o contraseña incorrectos.
                    </div>

                    <div class="submit-btn-container">
                        <button type="submit" class="btn-login" id="btn-login">Entrar</button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <!-- Scripts for login logic -->
    <script src="auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const ruc = document.getElementById('ruc').value;
            const usuario = document.getElementById('usuario').value;
            const clave = document.getElementById('clave').value;
            const btnLogin = document.getElementById('btn-login');
            const errorMsg = document.getElementById('error-message');

            btnLogin.textContent = 'Entrando...';
            btnLogin.disabled = true;
            errorMsg.style.display = 'none';

            // Override to accept specific RUC 201234569789
            if ((ruc === '20123456789' || ruc === '201234569789') && usuario === 'ADMIN' && clave === '123') {
                sessionStorage.setItem('sunat_auth', JSON.stringify({ ruc, usuario, denominacion: 'EMPRESA EJEMPLO S.A.C.' }));
                
                // Si viene del login del simulador 710, lo llevamos a la landing de renta
                const isRentaAuth = window.location.pathname.includes('login_710_auth.html');
                const defaultDestino = isRentaAuth ? 'renta_anual_landing.html' : 'menu_sol.html';
                
                const loginDestino = sessionStorage.getItem('loginReferrer') || defaultDestino;
                // Si la cookie referrer es el mismo login, usamos the default
                if(loginDestino.includes('login_710_auth.html')) {
                     window.location.href = defaultDestino;
                } else {
                     window.location.href = loginDestino;
                }
                
                return;
            }

            try {
                const authenticated = await loginConSupabase(ruc, usuario, clave);
                if (authenticated) {
                    const isRentaAuth = window.location.pathname.includes('login_710_auth.html');
                    const defaultDestino = isRentaAuth ? 'renta_anual_landing.html' : 'menu_sol.html';
                    
                    const loginDestino = sessionStorage.getItem('loginReferrer') || defaultDestino;
                    if(loginDestino.includes('login_710_auth.html')) {
                         window.location.href = defaultDestino;
                    } else {
                         window.location.href = loginDestino;
                    }
                } else {
                    errorMsg.style.display = 'block';
                    btnLogin.textContent = 'Entrar';
                    btnLogin.disabled = false;
                }
            } catch (err) {
                console.error("Error al iniciar sesión:", err);
                errorMsg.textContent = "Ocurrió un error al conectar con la base de datos.";
                errorMsg.style.display = 'block';
                btnLogin.textContent = 'Entrar';
                btnLogin.disabled = false;
            }
        });
    </script>
</body>
</html>
